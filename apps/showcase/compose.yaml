services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proof_notes
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d proof_notes"]
      interval: 2s
      timeout: 5s
      retries: 20

  showcase:
    build:
      context: ../..
      dockerfile: apps/showcase/Dockerfile
    image: agent-e2e-showcase-compose:local
    environment:
      DATABASE_URL: postgres://agent:agent@postgres:5432/proof_notes
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
