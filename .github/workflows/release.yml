name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish"
        required: true
        default: "v1.2.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish package and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Read package version
        id: package
        run: |
          version=$(node -p "require('./packages/harness/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi
          notes_file="docs/RELEASE_NOTES-v$version.md"
          if [ ! -f "$notes_file" ]; then
            echo "Missing release notes file: $notes_file" >&2
            exit 1
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        working-directory: packages/harness
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "@agent-e2e/harness@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "@agent-e2e/harness@${{ steps.package.outputs.version }} is already published; skipping npm publish."
          else
            npm publish --access public
          fi

      - name: Verify npm package
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm view "@agent-e2e/harness@${{ steps.package.outputs.version }}" version; then
              exit 0
            fi
            echo "npm registry has not exposed @agent-e2e/harness@${{ steps.package.outputs.version }} yet; retrying..."
            sleep 10
          done
          npm view "@agent-e2e/harness@${{ steps.package.outputs.version }}" version

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; skipping create."
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file "${{ steps.package.outputs.notes_file }}"
          fi
