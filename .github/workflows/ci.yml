name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Typecheck, Check, Showcase E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Check
        run: npm run check

      - name: Showcase E2E
        run: npm run test --workspace @agent-e2e/showcase
